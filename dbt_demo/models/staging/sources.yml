version: 2

# Sources mirror seed tables for documentation / lineage.
# Staging models use ref('raw_*') so Cosmos builds seed → staging task edges.
sources:
  - name: raw
    description: Raw seed tables loaded into schema dbt_test (same as seeds)
    database: demo_db
    schema: dbt_test
    tables:
      - name: raw_users
        description: >
          Raw user records (intentional DQ issues). Freshness WARN demo —
          created_at tops out in 2024, so warn_after (3 days) trips while
          error_after stays clear.
        loaded_at_field: created_at
        freshness:
          warn_after: {count: 3, period: day}
          error_after: {count: 1095, period: day}
        columns:
          - name: user_id
          - name: email
          - name: country
          - name: status
          - name: created_at
      - name: raw_products
        description: Product catalog
        columns:
          - name: product_id
          - name: product_name
          - name: category
          - name: price
      - name: raw_orders
        description: Order headers (contains invalid order_status)
        columns:
          - name: order_id
          - name: user_id
          - name: order_date
          - name: order_status
          - name: total_amount
      - name: raw_order_items
        description: Order line items
        columns:
          - name: item_id
          - name: order_id
          - name: product_id
          - name: quantity
          - name: unit_price

  # demo_showcase: payments + shipments for Elementary status matrix
  - name: payments
    description: Payment events for demo_showcase (freshness PASS + failing source tests)
    database: demo_db
    schema: dbt_test
    tags: [demo_showcase]
    tables:
      - name: raw_payments
        description: >
          Fresh payments seed. Source freshness PASS (recent _loaded_at).
          Column tests intentionally FAIL (null amount, invalid method).
        loaded_at_field: _loaded_at
        freshness:
          warn_after: {count: 2, period: day}
          error_after: {count: 7, period: day}
        columns:
          - name: payment_id
            data_tests:
              - unique:
                  config:
                    tags: [demo_showcase]
              - not_null:
                  config:
                    tags: [demo_showcase]
          - name: order_id
            data_tests:
              - not_null:
                  config:
                    tags: [demo_showcase]
          - name: amount
            description: Intentional nulls → source not_null FAIL (severity error)
            data_tests:
              - not_null:
                  config:
                    store_failures: true
                    severity: error
                    tags: [demo_showcase]
          - name: payment_method
            description: Intentional crypto_unknown → accepted_values FAIL
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['card', 'paypal', 'bank_transfer']
                  config:
                    store_failures: true
                    severity: error
                    tags: [demo_showcase]
          - name: currency
          - name: paid_at
          - name: _loaded_at

  - name: ops
    description: Operational feeds for demo_showcase (freshness ERROR)
    database: demo_db
    schema: dbt_test
    tags: [demo_showcase]
    tables:
      - name: raw_shipments
        description: >
          Stale shipments seed (~45d old _loaded_at). Source freshness ERROR
          with tight error_after (14 days). Also has DQ issues for model tests.
        loaded_at_field: _loaded_at
        freshness:
          warn_after: {count: 1, period: day}
          error_after: {count: 14, period: day}
        columns:
          - name: shipment_id
          - name: order_id
          - name: carrier
          - name: shipment_status
          - name: shipped_at
          - name: _loaded_at
