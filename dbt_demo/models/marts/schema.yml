version: 2

models:
  - name: fct_orders
    description: >
      Order-line fact with calculated_total (order-level sum), is_high_value flag,
      and product category for Elementary dimension anomalies.
    columns:
      - name: order_id
        data_tests:
          - not_null
      - name: item_id
        data_tests:
          - unique
          - not_null
      - name: calculated_total
        data_tests:
          - not_null
      - name: category
        data_tests:
          - not_null
      - name: order_date
        data_tests:
          - not_null
      - name: updated_at
        data_tests:
          - freshness_custom:
              arguments:
                max_hours: 1440

    data_tests:
      # Elementary volume anomalies on daily order volume
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: order_date
            time_bucket:
              period: day
              count: 1
            sensitivity: 2.5
          config:
            severity: warn
            store_failures: true
      # Elementary dimension anomalies by product category
      - elementary.dimension_anomalies:
          arguments:
            timestamp_column: order_date
            dimensions:
              - category
            time_bucket:
              period: day
              count: 1
            sensitivity: 2.5
          config:
            severity: warn
            store_failures: true
      - elementary.freshness_anomalies:
          arguments:
            timestamp_column: updated_at
          config:
            store_failures: true

  - name: dim_customers
    description: Customer dimension with order aggregates
    meta:
      owner: ["data_team","analytics"]
    columns:
      - name: user_id
        data_tests:
          - unique:
              config:
                enabled: true
                severity: error
                error_if: ">1000"
                warn_if: ">10"
                tags: ["critical", "finance"]
                meta:
                  owner: "@finance_squad"
                  incident_priority: "P2"
                  description: user_id value must be unique
                  Grudge: "I'm a grudge"
          - not_null
      - name: total_orders
        data_tests:
          - not_null
      - name: total_spent
        data_tests:
          - not_null
